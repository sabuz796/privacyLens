name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests (gate the release)
        run: swift test

      - name: Build app + package DMG
        run: ./Scripts/package_release.sh Release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shasum -a 256 PrivacyLens.dmg > PrivacyLens.dmg.sha256
          SHA="$(cut -d' ' -f1 PrivacyLens.dmg.sha256)"
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" PrivacyLens.dmg PrivacyLens.dmg.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              PrivacyLens.dmg PrivacyLens.dmg.sha256 \
              --title "$GITHUB_REF_NAME" \
              --notes "SHA-256 (\`PrivacyLens.dmg\`): \`$SHA\`" \
              --generate-notes \
              $PRERELEASE
          fi
