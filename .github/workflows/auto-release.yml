name: Auto Release

# Push code to main -> tests -> patch version bump -> DMG -> GitHub Release
# -> Homebrew cask bump. Fully automatic, no tags to remember.
#
# Only fires when app code changes (README-only edits don't cut releases).
# Put `[skip release]` in the commit message to push quietly.

on:
  push:
    branches: [main]
    paths:
      - "PrivacyLens/**"
      - "PrivacyLens.xcodeproj/**"
      - "Package.swift"
      - "Scripts/package_release.sh"

permissions:
  contents: write

jobs:
  auto-release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Unit tests (gate the release)
        run: swift test

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          LAST="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v1.0.0)"
          BASE="${LAST#v}"
          MAJOR="$(echo "$BASE" | cut -d. -f1)"; MAJOR="${MAJOR:-1}"
          MINOR="$(echo "$BASE" | cut -d. -f2)"; MINOR="${MINOR:-0}"
          PATCH="$(echo "$BASE" | cut -d. -f3 | grep -oE '^[0-9]+' || echo 0)"
          NEXT="v$MAJOR.$MINOR.$((PATCH + 1))"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT (from $LAST)"

      - name: Build app + package DMG
        run: ./Scripts/package_release.sh Release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEXT="${{ steps.version.outputs.next }}"
          shasum -a 256 PrivacyLens.dmg > PrivacyLens.dmg.sha256
          SHA="$(cut -d' ' -f1 PrivacyLens.dmg.sha256)"
          git tag "$NEXT"
          git push origin "$NEXT"
          gh release create "$NEXT" \
            PrivacyLens.dmg PrivacyLens.dmg.sha256 \
            --title "$NEXT" \
            --notes "SHA-256 (\`PrivacyLens.dmg\`): \`$SHA\`" \
            --generate-notes

      - name: Bump Homebrew cask
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.next }}"
          VERSION="${VERSION#v}"
          SHA="$(cut -d' ' -f1 PrivacyLens.dmg.sha256)"
          sed -i '' "s/^  version \".*\"/  version \"$VERSION\"/" Casks/privacylens.rb
          sed -i '' "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/privacylens.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/privacylens.rb
          git commit -m "chore: bump cask to $VERSION [skip release]"
          git push origin main
